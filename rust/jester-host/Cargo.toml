[package]
name = "jester"
version = "1.2.1"
edition = "2021"
description = "Jester host in Rust. UI stays React, tunnel stays mihomo."

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
url = "2"
zip = "2"
futures-util = "0.3"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.15", optional = true }
tray-icon = { version = "0.20", optional = true, default-features = false }
wry = { version = "0.53", optional = true }
tao = { version = "0.34", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:wry", "dep:tao", "dep:tray-icon", "dep:rfd", "dep:image"]

[lib]
name = "jester"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "jester"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
flate2 = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
